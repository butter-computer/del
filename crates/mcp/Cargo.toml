[package]
name = "del-mcp"
description = "del's own MCP server for TUI-mode agents (streamable HTTP + stdio proxy)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "del-mcp-stdio"
path = "src/bin/del-mcp-stdio.rs"

[dependencies]
del-agent = { workspace = true }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
ureq = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"
