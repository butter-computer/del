[package]
name = "del-claude"
description = "Claude Code backend for del: drives the user's installed `claude` CLI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
del-agent.workspace = true
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt", "sync", "time", "process", "io-util", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "time"] }
