[package]
name = "del-agent"
description = "Harness-neutral agent layer (Codex / Claude) for the del app."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
libc = "0.2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "process", "io-util", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
