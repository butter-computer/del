[package]
name = "del-app"
description = "GPUI desktop window for the del app."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "del"
path = "src/main.rs"

[dependencies]
del-core.workspace = true
del-agent.workspace = true
async-trait = "0.1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
gpui-kit.workspace = true
# Listed explicitly so the exact GPUI snapshot is a hard constraint of this
# workspace, not only an implementation detail of gpui-kit.
gpui.workspace = true
# Decodes the wallpaper ahead of the first frame. Same crate and version GPUI
# uses internally, so it adds no new code to the build.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
del-codex = { path = "../codex" }
del-claude = { path = "../claude" }
del-acp = { path = "../acp" }
del-terminal = { path = "../terminal" }
del-mcp.workspace = true
