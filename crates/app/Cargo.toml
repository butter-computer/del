[package]
name = "del-app"
description = "GPUI desktop window for the del app."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "del"
path = "src/main.rs"

[dependencies]
del-core.workspace = true
del-agent.workspace = true
async-trait = "0.1"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util", "macros"] }
gpui-kit.workspace = true
# Listed explicitly so the exact GPUI snapshot is a hard constraint of this
# workspace, not only an implementation detail of gpui-kit.
gpui.workspace = true
# Decodes the wallpaper ahead of the first frame. Same crate and version GPUI
# uses internally, so it adds no new code to the build.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif", "ico", "pnm"] }
del-codex = { path = "../codex" }
del-claude = { path = "../claude" }
del-opencode = { path = "../opencode" }
del-acp = { path = "../acp" }
del-terminal = { path = "../terminal" }
del-mcp.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
gpui-apple = { package = "gpui-pre-apple", version = "=0.3.9" }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }

[build-dependencies]
cc = "1"
