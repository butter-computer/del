[workspace]
resolver = "2"
exclude = ["vendor/gpui-pre-apple"]
members = ["crates/core", "crates/agent", "crates/codex", "crates/claude", "crates/acp", "crates/app", "crates/terminal", "crates/mcp", "crates/opencode"]

[workspace.package]
version = "0.1.13"
edition = "2024"
publish = false

[workspace.dependencies]
del-core = { path = "crates/core" }
del-agent = { path = "crates/agent" }
del-mcp = { path = "crates/mcp" }

# GPUI is published by Zed as the `gpui-pre-*` crate family (snapshots of
# zed-industries/zed's crates). gpui-kit bundles gpui, gpui_platform, gpui-base
# and gpui-component against one exact snapshot. Both pins below are exact and
# must move together: gpui-kit 0.8.0 is built against gpui-pre 0.3.9.
gpui-kit = "=0.8.0"
gpui = { package = "gpui-pre", version = "=0.3.9" }

[profile.dev]
# gpui and its dependency tree are large; optimizing deps keeps the window snappy.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# Local alpha GPU-surface support; registry sources remain untouched.
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }

# Submenu labels can select a default while retaining hover account choices.
gpui-component = { path = "vendor/gpui-component" }
